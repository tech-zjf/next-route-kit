<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 900" role="img" aria-labelledby="title description">
    <title id="title">next-route-kit 请求处理链路</title>
    <desc id="description">手绘风格的 Next.js 请求流程图：请求经过参数解析、Middleware、Guard、声明的参数解析、Pipe、Interceptor、Handler、Response Serializer，并通过 Exception Filter 处理异常。</desc>
    <defs>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
        <marker id="orange-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#e46d2f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
    </defs>

    <rect width="1900" height="900" fill="#fffdf8" />

    <text x="950" y="74" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, KaiTi, sans-serif" font-size="42" font-weight="700" fill="#171717">next-route-kit · 一次配置，保持路由干净</text>
    <text x="950" y="116" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, KaiTi, sans-serif" font-size="22" fill="#e46d2f">全局 Factory → 业务 Scope → 原生 Route Handler</text>

    <g fill="#fffdf8" stroke="#171717" stroke-width="4" stroke-linejoin="round">
        <path d="M 80 178 Q 82 167 96 168 L 352 168 Q 366 169 365 182 L 365 282 Q 364 295 350 294 L 96 294 Q 81 293 82 280 Z" />
