        <path d="M 755 178 Q 757 167 771 168 L 1019 168 Q 1034 169 1033 182 L 1033 282 Q 1032 295 1018 294 L 771 294 Q 756 293 757 280 Z" />
        <path d="M 1088 178 Q 1090 167 1104 168 L 1354 168 Q 1369 169 1368 182 L 1368 282 Q 1367 295 1353 294 L 1104 294 Q 1089 293 1090 280 Z" />
        <path d="M 1422 178 Q 1424 167 1438 168 L 1810 168 Q 1825 169 1824 182 L 1824 282 Q 1823 295 1809 294 L 1438 294 Q 1423 293 1424 280 Z" />
    </g>

    <g font-family="Comic Sans MS, Chalkboard SE, KaiTi, sans-serif" fill="#171717" text-anchor="middle">
        <text x="222" y="215" font-size="28" font-weight="700">全局 Factory</text>
        <text x="222" y="252" font-size="20">请求 ID · 日志 · 统一响应</text>
        <text x="222" y="277" font-size="20">一次配置，多路由复用</text>
        <text x="560" y="215" font-size="28" font-weight="700">业务 Scope</text>
        <text x="560" y="252" font-size="20">认证 · 管理员 · 业务策略</text>
        <text x="560" y="277" font-size="20">route.extend({ ... })</text>
        <text x="894" y="215" font-size="28" font-weight="700">原生 Route Handler</text>
        <text x="894" y="252" font-size="20">保持 app/**/route.ts</text>
        <text x="894" y="277" font-size="20">GET / POST / PATCH ...</text>
        <text x="1228" y="215" font-size="28" font-weight="700">业务输入</text>
        <text x="1228" y="252" font-size="20">body · query · params · headers</text>
        <text x="1228" y="277" font-size="20">类型安全的 input 声明</text>
        <text x="1623" y="215" font-size="28" font-weight="700">业务结果</text>
        <text x="1623" y="252" font-size="20">Handler 保持简洁</text>
        <text x="1623" y="277" font-size="20">策略保持可复用</text>
    </g>

