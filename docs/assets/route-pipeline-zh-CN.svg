<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 900" role="img" aria-labelledby="title description">
    <title id="title">next-route-kit 请求处理链路</title>
    <desc id="description">手绘风格的 Next.js Route Handler 链路图：请求经过参数准备、Middleware、Guard，进入 Interceptor 边界，再经过参数解析、Pipe、Handler，最后退出 Interceptor 并序列化响应；任意阶段的异常进入 Exception Filter。</desc>
    <defs>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
        <marker id="orange-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#e46d2f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
    </defs>

    <rect width="1900" height="900" fill="#fffdf8" />

    <g font-family="Comic Sans MS, Chalkboard SE, KaiTi, sans-serif" fill="#171717" text-anchor="middle">
        <text x="950" y="70" font-size="42" font-weight="700">next-route-kit · 一次配置，保持 Route Handler 干净</text>
        <text x="950" y="110" font-size="22" fill="#e46d2f">全局 Factory → 业务 Scope → 原生 Route Handler</text>
    </g>

    <g fill="#fffdf8" stroke="#171717" stroke-width="4" stroke-linejoin="round">
        <path d="M 80 170 Q 82 159 96 160 L 352 160 Q 366 161 365 174 L 365 274 Q 364 287 350 286 L 96 286 Q 81 285 82 272 Z" />
        <path d="M 420 170 Q 422 159 436 160 L 686 160 Q 701 161 700 174 L 700 274 Q 699 287 685 286 L 436 286 Q 421 285 422 272 Z" />
        <path d="M 755 170 Q 757 159 771 160 L 1019 160 Q 1034 161 1033 174 L 1033 274 Q 1032 287 1018 286 L 771 286 Q 756 285 757 272 Z" />
        <path d="M 1088 170 Q 1090 159 1104 160 L 1354 160 Q 1369 161 1368 174 L 1368 274 Q 1367 287 1353 286 L 1104 286 Q 1089 285 1090 272 Z" />
        <path d="M 1422 170 Q 1424 159 1438 160 L 1810 160 Q 1825 161 1824 174 L 1824 274 Q 1823 287 1809 286 L 1438 286 Q 1423 285 1424 272 Z" />
    </g>

    <g font-family="Comic Sans MS, Chalkboard SE, KaiTi, sans-serif" fill="#171717" text-anchor="middle">
        <text x="222" y="207" font-size="28" font-weight="700">全局 Factory</text>
        <text x="222" y="244" font-size="20">请求 ID · 日志 · 统一响应</text>
        <text x="222" y="269" font-size="20">一次配置，多路由复用</text>
        <text x="560" y="207" font-size="28" font-weight="700">业务 Scope</text>
        <text x="560" y="244" font-size="20">认证 · 管理员 · 业务策略</text>
        <text x="560" y="269" font-size="20">route.extend({ ... })</text>
        <text x="894" y="207" font-size="28" font-weight="700">原生 Route Handler</text>
        <text x="894" y="244" font-size="20">保持 app/**/route.ts</text>
        <text x="894" y="269" font-size="20">GET / POST / PATCH ...</text>
        <text x="1228" y="207" font-size="28" font-weight="700">业务输入</text>
        <text x="1228" y="244" font-size="20">body · query · params · headers</text>
        <text x="1228" y="269" font-size="20">只声明真正需要的值</text>
        <text x="1623" y="207" font-size="28" font-weight="700">业务结果</text>
        <text x="1623" y="244" font-size="20">Handler 保持简洁</text>
        <text x="1623" y="269" font-size="20">策略保持可复用</text>
    </g>

    <g fill="none" stroke="#e46d2f" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#orange-arrow)">
        <path d="M 365 223 C 383 216 401 231 422 223" />
        <path d="M 700 223 C 718 216 736 231 757 223" />
        <path d="M 1033 223 C 1051 216 1069 231 1090 223" />
        <path d="M 1368 223 C 1386 216 1404 231 1424 223" />
    </g>

    <text x="950" y="342" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, KaiTi, sans-serif" font-size="25" font-weight="700" fill="#171717">真实请求执行链路</text>

    <g fill="#fffdf8" stroke="#171717" stroke-width="4" stroke-linejoin="round">
        <path d="M 45 395 Q 47 384 60 385 L 205 385 Q 218 386 217 399 L 217 511 Q 216 524 203 523 L 60 523 Q 46 522 47 509 Z" />
        <path d="M 245 395 Q 247 384 260 385 L 430 385 Q 443 386 442 399 L 442 511 Q 441 524 428 523 L 260 523 Q 246 522 247 509 Z" />
        <path d="M 470 395 Q 472 384 485 385 L 635 385 Q 648 386 647 399 L 647 511 Q 646 524 633 523 L 485 523 Q 471 522 472 509 Z" />
        <path d="M 675 395 Q 677 384 690 385 L 820 385 Q 833 386 832 399 L 832 511 Q 831 524 818 523 L 690 523 Q 676 522 677 509 Z" />
        <path d="M 1635 395 Q 1637 384 1650 385 L 1840 385 Q 1853 386 1852 399 L 1852 511 Q 1851 524 1838 523 L 1650 523 Q 1636 522 1637 509 Z" />
    </g>

    <path d="M 865 355 Q 867 343 881 344 L 1580 344 Q 1594 345 1593 358 L 1593 550 Q 1592 563 1578 562 L 881 562 Q 866 561 867 548 Z" fill="#fffdf8" stroke="#171717" stroke-width="4" stroke-dasharray="13 9" stroke-linejoin="round" />

    <g fill="#fffdf8" stroke="#171717" stroke-width="4" stroke-linejoin="round">
        <path d="M 895 413 Q 897 402 910 403 L 1070 403 Q 1083 404 1082 417 L 1082 511 Q 1081 524 1068 523 L 910 523 Q 896 522 897 509 Z" />
        <path d="M 1110 413 Q 1112 402 1125 403 L 1285 403 Q 1298 404 1297 417 L 1297 511 Q 1296 524 1283 523 L 1125 523 Q 1111 522 1112 509 Z" />
        <path d="M 1325 413 Q 1327 402 1340 403 L 1510 403 Q 1523 404 1522 417 L 1522 511 Q 1521 524 1508 523 L 1340 523 Q 1326 522 1327 509 Z" />
    </g>

    <g fill="none" stroke="#171717" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
        <path d="M 220 454 C 229 446 236 462 245 454" />
        <path d="M 445 454 C 454 446 461 462 470 454" />
        <path d="M 650 454 C 659 446 666 462 675 454" />
        <path d="M 835 454 C 846 446 854 462 865 454" />
        <path d="M 1085 463 C 1094 455 1101 471 1110 463" />
        <path d="M 1300 463 C 1309 455 1316 471 1325 463" />
        <path d="M 1597 454 C 1610 446 1622 462 1635 454" />
    </g>

    <g font-family="Comic Sans MS, Chalkboard SE, KaiTi, sans-serif" fill="#171717" text-anchor="middle">
        <text x="131" y="433" font-size="24" font-weight="700">请求</text>
        <text x="131" y="468" font-size="19">Client Call</text>
        <text x="343" y="427" font-size="22" font-weight="700">Next Params</text>
        <text x="343" y="458" font-size="22" font-weight="700">Hydration</text>
        <text x="343" y="493" font-size="18">动态 params 就绪</text>
        <text x="558" y="433" font-size="23" font-weight="700">Middleware</text>
        <text x="558" y="468" font-size="18">预处理 · locals</text>
        <text x="753" y="433" font-size="24" font-weight="700">Guard</text>
        <text x="753" y="468" font-size="18">认证 · 权限</text>
        <text x="1228" y="375" font-size="22" font-weight="700" fill="#e46d2f">Interceptor 边界</text>
        <text x="1228" y="397" font-size="17" fill="#e46d2f">进入 → 包裹 → 退出</text>
        <text x="988" y="438" font-size="21" font-weight="700">Argument</text>
        <text x="988" y="469" font-size="21" font-weight="700">Resolver</text>
        <text x="988" y="500" font-size="17">读取 Body / Query</text>
        <text x="1203" y="438" font-size="22" font-weight="700">Pipe</text>
        <text x="1203" y="469" font-size="18">校验 · 转换</text>
        <text x="1418" y="438" font-size="23" font-weight="700">Handler</text>
        <text x="1418" y="469" font-size="18">业务逻辑</text>
        <text x="1743" y="433" font-size="21" font-weight="700">Response</text>
        <text x="1743" y="464" font-size="21" font-weight="700">Serializer</text>
        <text x="1743" y="497" font-size="18">JSON / Response</text>
        <text x="853" y="405" font-size="17" fill="#e46d2f">进入</text>
        <text x="1615" y="405" font-size="17" fill="#e46d2f">退出</text>
    </g>

    <path d="M 1185 565 C 1165 603 1040 615 1005 650" fill="none" stroke="#e46d2f" stroke-width="3" stroke-dasharray="11 10" marker-end="url(#orange-arrow)" />
    <text x="1240" y="611" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, KaiTi, sans-serif" font-size="21" fill="#e46d2f">任意阶段抛出异常</text>

    <g fill="#fff7ef" stroke="#e46d2f" stroke-width="4" stroke-linejoin="round">
        <path d="M 700 680 Q 702 669 715 670 L 1015 670 Q 1028 671 1027 684 L 1027 790 Q 1026 803 1013 802 L 715 802 Q 701 801 702 788 Z" />
        <path d="M 1160 680 Q 1162 669 1175 670 L 1515 670 Q 1528 671 1527 684 L 1527 790 Q 1526 803 1513 802 L 1175 802 Q 1161 801 1162 788 Z" />
    </g>
    <path d="M 1027 735 C 1070 727 1120 743 1160 735" fill="none" stroke="#e46d2f" stroke-width="3" marker-end="url(#orange-arrow)" />
    <g font-family="Comic Sans MS, Chalkboard SE, KaiTi, sans-serif" fill="#171717" text-anchor="middle">
        <text x="864" y="719" font-size="27" font-weight="700">Exception Filter</text>
        <text x="864" y="757" font-size="19">状态 · code · message</text>
        <text x="1343" y="719" font-size="27" font-weight="700">Error Response</text>
        <text x="1343" y="757" font-size="19">统一错误契约</text>
    </g>

    <text x="950" y="865" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, KaiTi, sans-serif" font-size="20" fill="#555">全局策略只注册一次 · Route 文件保持原生 · 每个阶段都可插拔</text>
</svg>
