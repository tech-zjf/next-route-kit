        <text x="1520" y="446" font-size="24" font-weight="700">Handler</text>
        <text x="1520" y="480" font-size="18">业务逻辑</text>
        <text x="1737" y="438" font-size="21" font-weight="700">Response</text>
        <text x="1737" y="469" font-size="21" font-weight="700">Serializer</text>
        <text x="1737" y="503" font-size="18">JSON / Response</text>
    </g>

