name: Release

on:
    workflow_dispatch:
        inputs:
            confirm:
                description: Publish the current main commit to npm
                required: true
                default: false
                type: boolean

permissions:
    contents: write
    id-token: write

concurrency:
    group: npm-release
    cancel-in-progress: false

jobs:
    release:
        if: inputs.confirm == true
        runs-on: ubuntu-latest
        environment:
            name: npm-release
        steps:
            - name: Checkout release commit
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0

            - name: Restore default branch ref for Changesets
              run: git branch --force "${{ github.event.repository.default_branch }}" "${GITHUB_SHA}"

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10.26.0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run release gate
              run: pnpm release:check

            - name: Verify Changesets state
              run: pnpm release:status

            - name: Configure npm authentication
              run: npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish packages
              run: pnpm release:publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true

            - name: Configure Git identity
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Synchronize release tags
              run: pnpm release:tags
